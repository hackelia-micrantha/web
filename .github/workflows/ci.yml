name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: yarn prettier --list-different . | tee formatting-files.txt

      - name: Upload formatting differences
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-differences-${{ github.run_id }}
          path: formatting-files.txt
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        id: lint
        continue-on-error: true
        run: yarn lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: yarn typecheck

      - name: Build
        id: build
        continue-on-error: true
        run: yarn build

      - name: Verify quality checks
        if: always()
        run: |
          if [[ "${{ steps.formatting.outcome }}" != "success" || \
                "${{ steps.lint.outcome }}" != "success" || \
                "${{ steps.typecheck.outcome }}" != "success" || \
                "${{ steps.build.outcome }}" != "success" ]]; then
            exit 1
          fi

  end-to-end:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run Playwright tests
        run: yarn test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
