name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check repository formatting
        id: formatting
        run: yarn format:check

      - name: Generate formatting patch
        if: failure() && steps.formatting.outcome == 'failure'
        run: |
          yarn prettier --write .
          git diff -- . > formatting.patch

      - name: Upload formatting patch
        if: failure() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-patch-${{ github.run_id }}
          path: formatting.patch
          if-no-files-found: error
          retention-days: 7

      - name: Lint repository
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Verify pinned Wrangler
        run: yarn wrangler --version

      - name: Bundle Cloudflare Pages Function
        run: yarn cloudflare:functions:build

      - name: Enforce Cloudflare Worker size budget
        env:
          CLOUDFLARE_WORKERS_PLAN: ${{ vars.CLOUDFLARE_WORKERS_PLAN || 'free' }}
        run: yarn test:cloudflare:size

      - name: Report Pages Function bundle files
        run: find .cloudflare/functions -type f -printf '%p %s bytes\n' | sort

      - name: Upload Pages Function bundle metadata
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-function-${{ github.run_id }}
          path: .cloudflare/functions
          if-no-files-found: error
          retention-days: 7

      - name: Test Cloudflare Pages adapter contract
        run: yarn test:cloudflare:adapter

      - name: Test Cloudflare Pages runtime contract
        run: yarn test:cloudflare:runtime

      - name: Upload Cloudflare runtime manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-runtime-${{ github.run_id }}
          path: .cloudflare/runtime/manifest.json
          if-no-files-found: ignore
          retention-days: 7

  end-to-end:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run functional Playwright tests
        run: yarn playwright test --grep-invert "visual regressions"

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
