name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Quality
    runs-on: runner-web
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up project toolchain
        uses: ./.github/actions/setup

      - name: Verify tracked-publication secret policy
        run: yarn security:publication

      - name: Run unit tests with coverage thresholds
        run: yarn test:unit

      - name: Test production deployment admission gate
        run: node --test tests/operations/cloudflare-deployment-gate.test.js

      - name: Validate project registry projection
        run: yarn test:project-registry-projection

      - name: Check repository formatting
        id: formatting
        run: yarn format:check

      - name: Generate formatting patch
        if: failure() && steps.formatting.outcome == 'failure'
        run: |
          yarn prettier --write .
          git diff -- . > formatting.patch

      - name: Upload formatting patch
        if: failure() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formatting-patch-${{ github.run_id }}
          path: formatting.patch
          if-no-files-found: error
          retention-days: 7

      - name: Lint repository
        run: yarn lint

      - name: Test blog MDX grammar validator
        run: yarn test:blog-mdx-validation

      - name: Validate blog content boundaries
        run: yarn test:blog-content-boundaries

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Check generated public assets for accidental key publication
        run: node scripts/check-publication-secrets.js --public

      - name: Verify blog browser chunk isolation
        run: yarn test:blog-chunk-isolation

      - name: Enforce deterministic web performance budgets
        run: yarn test:performance-budgets

      - name: Upload web performance budget report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-performance-budget-${{ github.run_id }}
          path: .performance/build-budget.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify pinned Wrangler
        run: yarn wrangler --version

      - name: Bundle Cloudflare Pages Function
        run: yarn cloudflare:functions:build

      - name: Verify generated Cloudflare Functions bundle
        run: node scripts/check-publication-secrets.js --functions

      - name: Enforce Cloudflare Worker bundle budget
        run: yarn test:cloudflare:bundle-budget

      - name: Report Pages Function bundle files
        run: find .cloudflare/functions -type f -printf '%p %s bytes\n' | sort

      - name: Upload Pages Function bundle metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-pages-function-${{ github.run_id }}
          path: .cloudflare/functions
          if-no-files-found: error
          retention-days: 7

      - name: Run Cloudflare integration tests
        run: yarn test:integration

      - name: Upload Cloudflare runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-pages-runtime-${{ github.run_id }}
          path: |
            .cloudflare/runtime/manifest.json
            .cloudflare/runtime/performance-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve failed quality-build diagnostics
        id: failure_evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-quality-failure-${{ github.run_id }}
          path: |
            build/
            public/build/
            public/tailwind.css
            .cloudflare/functions/
            .performance/
          if-no-files-found: error
          retention-days: 7

      - name: Clean task-local generated build outputs
        if: ${{ always() && (success() || steps.failure_evidence.outcome == 'success') }}
        run: yarn clean:build

  end-to-end:
    name: End-to-end
    runs-on: runner-web
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up project toolchain
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Run functional Playwright tests
        run: yarn playwright test --grep-invert "visual regressions"

      - name: Upload advisory browser performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-performance-advisory-${{ github.run_id }}
          path: .performance/browser
          if-no-files-found: error
          retention-days: 7

      - name: Run Cloudflare hydration browser contracts
        run: yarn test:e2e:cloudflare

      - name: Upload Playwright failure artifacts
        id: failure_evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report
            playwright-report-cloudflare
            test-results
            test-results-cloudflare
            .performance/browser
          if-no-files-found: error
          retention-days: 7

      - name: Clean task-local browser outputs after evidence uploads
        if: ${{ always() && (success() || steps.failure_evidence.outcome == 'success') }}
        run: yarn clean:browser

  visual-regression:
    name: Visual regression
    needs:
      - quality
      - end-to-end
    if: ${{ always() && needs.quality.result == 'success' && needs.end-to-end.result == 'success' }}
    runs-on: runner-web
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up project toolchain
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Run advisory visual regression tests
        id: visual
        continue-on-error: true
        run: yarn playwright test e2e/visual.spec.ts --project=desktop-chromium

      - name: Upload visual regression evidence
        id: visual_evidence
        if: always() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            test-results/**/*-actual.png
            test-results/**/*-expected.png
            test-results/**/*-diff.png
          if-no-files-found: error
          retention-days: 7

      - name: Report advisory result
        if: always()
        run: |
          echo "Visual regression outcome: ${{ steps.visual.outcome }}"
          if [ "${{ steps.visual.outcome }}" != "success" ]; then
            echo "Visual differences are advisory while #53 baselines are under review."
          fi

      - name: Clean task-local visual outputs
        if: ${{ always() && (steps.visual.outcome == 'success' || steps.visual_evidence.outcome == 'success') }}
        run: yarn clean:browser
