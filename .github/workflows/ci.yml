name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run unit tests with coverage thresholds
        run: yarn test:unit

      - name: Check repository formatting
        id: formatting
        run: yarn format:check

      - name: Generate formatting patch
        if: failure() && steps.formatting.outcome == 'failure'
        run: |
          yarn prettier --write .
          git diff -- . > formatting.patch

      - name: Upload formatting patch
        if: failure() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-patch-${{ github.run_id }}
          path: formatting.patch
          if-no-files-found: error
          retention-days: 7

      - name: Lint repository
        run: yarn lint

      - name: Test blog MDX grammar validator
        run: yarn test:blog-mdx-validation

      - name: Validate blog content boundaries
        run: yarn test:blog-content-boundaries

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Verify blog browser chunk isolation
        run: yarn test:blog-chunk-isolation

      - name: Enforce deterministic web performance budgets
        run: yarn test:performance-budgets

      - name: Upload web performance budget report
        uses: actions/upload-artifact@v4
        with:
          name: web-performance-budget-${{ github.run_id }}
          path: .performance/build-budget.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify pinned Wrangler
        run: yarn wrangler --version

      - name: Bundle Cloudflare Pages Function
        run: yarn cloudflare:functions:build

      - name: Enforce Cloudflare Worker bundle budget
        run: yarn test:cloudflare:bundle-budget

      - name: Report Pages Function bundle files
        run: find .cloudflare/functions -type f -printf '%p %s bytes\n' | sort

      - name: Upload Pages Function bundle metadata
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-function-${{ github.run_id }}
          path: .cloudflare/functions
          if-no-files-found: error
          retention-days: 7

      - name: Run Cloudflare integration tests
        run: yarn test:integration

      - name: Upload Cloudflare runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-runtime-${{ github.run_id }}
          path: |
            .cloudflare/runtime/manifest.json
            .cloudflare/runtime/performance-report.json
          if-no-files-found: ignore
          retention-days: 7

  end-to-end:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run functional Playwright tests
        run: yarn playwright test --grep-invert "visual regressions"

      - name: Upload advisory browser performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: browser-performance-advisory-${{ github.run_id }}
          path: test-results
          if-no-files-found: error
          retention-days: 7

      - name: Run Cloudflare hydration browser contracts
        run: yarn test:e2e:cloudflare

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report
            playwright-report-cloudflare
            test-results
            test-results-cloudflare
          if-no-files-found: ignore
          retention-days: 7
