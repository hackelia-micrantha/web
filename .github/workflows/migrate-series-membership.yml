name: Migrate Blog Series Membership

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/post-owned-series-membership'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Move series membership onto posts
        run: node scripts/migrate-series-membership.js

      - name: Format migrated registries
        run: yarn prettier --write app/content/blog.tsx app/content/blog-governance-native.tsx

      - name: Commit migrated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/content/blog.tsx app/content/blog-governance-native.tsx
          if git diff --cached --quiet; then
            echo "Series membership is already migrated"
            exit 0
          fi
          git commit -m "Move blog series membership onto posts"
          git push origin HEAD:${{ github.head_ref }}
