name: Clean Up Obsolete Blog Series Helpers

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/post-owned-series-membership'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Remove obsolete helpers
        run: node scripts/remove-obsolete-blog-series-helpers.js

      - name: Format migrated registry
        run: yarn prettier --write app/content/blog.tsx

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/content/blog.tsx
          if git diff --cached --quiet; then
            echo "Obsolete helpers are already removed"
            exit 0
          fi
          git commit -m "Remove obsolete local series helpers"
          git push origin HEAD:${{ github.head_ref }}
