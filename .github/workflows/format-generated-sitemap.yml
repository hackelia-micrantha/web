name: Format Generated Sitemap Slice

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/generated-blog-sitemap'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Apply repository formatting
        run: yarn prettier --write scripts/blog-content-inventory.js scripts/check-blog-content-boundaries.js scripts/generate-sitemap.js public/sitemap.xml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/blog-content-inventory.js scripts/check-blog-content-boundaries.js scripts/generate-sitemap.js public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Formatting is already current"
            exit 0
          fi
          git commit -m "Format generated sitemap slice"
          git push origin HEAD:${{ github.head_ref }}
