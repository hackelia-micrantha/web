name: Inspect Blog Browser Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/migrate-software-layers-mdx'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build browser assets
        run: yarn build

      - name: Create focused inspection report
        run: |
          {
            echo '=== browser files ==='
            find public/build -type f -printf '%p %s bytes\n' | sort
            echo '=== manifests ==='
            find public/build build -maxdepth 4 -type f -iname '*manifest*' -print | sort
            echo '=== route slug references ==='
            grep -R -n -E 'ai-pipelines-need-control-boundaries|software-layers-are-risk-boundaries' public/build build || true
            echo '=== AI body marker files ==='
            grep -R -l -F 'AI is not the system of record' public/build build || true
            echo '=== software layers body marker files ==='
            grep -R -l -F 'Software layers are not only a code-organization preference' public/build build || true
          } > blog-build-inspection.txt

      - name: Upload focused inspection report
        uses: actions/upload-artifact@v4
        with:
          name: blog-build-inspection-${{ github.run_id }}
          path: blog-build-inspection.txt
          if-no-files-found: error
          retention-days: 1
