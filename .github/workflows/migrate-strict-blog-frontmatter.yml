name: Migrate Strict Blog Frontmatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/strict-blog-frontmatter-schema'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Apply strict frontmatter migration
        run: node scripts/migrate-strict-blog-frontmatter.js

      - name: Regenerate metadata and sitemap
        run: yarn generate:blog-content

      - name: Format migrated files
        run: yarn prettier --write scripts/blog-content-inventory.js app/content/blog.ts app/content/blog-mdx-route.tsx app/utils/seo.ts app/routes/blog.recursive-governance-and-agent-workflows/content.mdx scripts/test-cloudflare-adapter.js docs/architecture/blog-publication-workflow.md e2e/blog-updated-at.spec.ts scripts/blog-frontmatter-schema.js tests/unit/blog-frontmatter-schema.test.js

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/blog-content-inventory.js app/content/blog.ts app/content/blog-mdx-route.tsx app/utils/seo.ts app/routes/blog.recursive-governance-and-agent-workflows/content.mdx scripts/test-cloudflare-adapter.js docs/architecture/blog-publication-workflow.md e2e/blog-updated-at.spec.ts scripts/blog-frontmatter-schema.js tests/unit/blog-frontmatter-schema.test.js app/content/blog.generated.ts public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Strict frontmatter migration is already applied"
            exit 0
          fi
          git commit -m "Enforce strict blog frontmatter schema"
          git push origin HEAD:${{ github.head_ref }}
