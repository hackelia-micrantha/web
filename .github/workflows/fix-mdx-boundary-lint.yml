name: Fix MDX Boundary Lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/enforce-mdx-grammar'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Replace control-character regexes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/blog-mdx-boundary.js")
          source = path.read_text()
          old = r'''function validateExternalOrInternalLink(value, filePath, node) {
            if (
              /^[\u0000-\u0020\u007f]/.test(value) ||
              /[\u0000-\u001f\u007f]/.test(value)
            ) {
          '''
          new = '''function validateExternalOrInternalLink(value, filePath, node) {
            const hasControlCharacter = [...value].some((character) => {
              const codePoint = character.codePointAt(0)
              return codePoint <= 0x1f || codePoint === 0x7f
            })

            if (value !== value.trimStart() || hasControlCharacter) {
          '''
          if old not in source:
              raise SystemExit("Expected control-character validation block was not found")
          path.write_text(source.replace(old, new, 1))
          PY
          yarn prettier --write scripts/blog-mdx-boundary.js

      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/blog-mdx-boundary.js
          git commit -m "Avoid control-character regexes in MDX validation"
          git push origin HEAD:${{ github.head_ref }}
