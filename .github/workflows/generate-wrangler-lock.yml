name: Generate Wrangler Lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Resolve pinned dependencies
        run: yarn install --non-interactive

      - name: Verify Wrangler version
        run: yarn wrangler --version

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
            exit 0
          fi
          git commit -m "Lock pinned Wrangler dependency"
          git push origin HEAD:${{ github.head_ref }}
